# Map incoming X-Forwarded-Proto to FastCGI HTTPS parameter
map $http_x_forwarded_proto $fastcgi_https {
    default $https;
    https on;
}

# Determine appropriate default port if X-Forwarded-Port was not provided by reverse proxy
map $http_x_forwarded_proto $default_forwarded_port {
    https 443;
    default $server_port;
}

# Preserve incoming X-Forwarded-Port if present, else fallback to proto-based port
map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    "" $default_forwarded_port;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 25M;

    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
        fastcgi_param SERVER_PORT $forwarded_port;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
